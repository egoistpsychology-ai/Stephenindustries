name: Phase 0/1 compatibility and guardrail tests

on:
  push:
    branches: ["main", "chatgpt/phase-*"]
  pull_request:
    branches: ["main"]

jobs:
  python-311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify CrewAI API and event hooks
        run: |
          python - <<'PY'
          import inspect
          from crewai import Agent, LLM
          from crewai.events import LLMCallCompletedEvent, LLMCallStartedEvent, crewai_event_bus
          from crewai.utilities.types import UsageMetrics
          print("LLM signature:", inspect.signature(LLM))
          print("Agent signature:", inspect.signature(Agent))
          assert "api_key" in inspect.signature(LLM).parameters
          assert "base_url" in inspect.signature(LLM).parameters
          for name in ("max_iter", "max_rpm", "max_execution_time"):
              assert name in inspect.signature(Agent).parameters, name
          print("LLM event hooks and CrewAI constructors import successfully.")
          print("UsageMetrics type:", UsageMetrics)
          PY
      - name: Run mocked guardrail tests
        run: python -m unittest discover -s tests -v
