<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>Stephen Industries</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark">S</div>
      <div>
        <h1>Stephen Industries</h1>
        <p>AI engineering team</p>
      </div>
      <span class="online"><span></span> Ready</span>
    </header>
    <section class="conversation" aria-label="Conversation">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✳</div>
        <h2>What are we building today?</h2>
        <p>Ask Stephen, Seer, and Escanor to think it through with you.</p>
      </div>
      <div id="messages" class="messages" aria-live="polite"></div>
    </section>
    <footer class="composer-wrap">
      <div class="status" id="status" role="status">Ready when you are.</div>
      <form id="chat-form" class="composer">
        <textarea id="message" rows="1" placeholder="Message Stephen Industries…" aria-label="Your message" required></textarea>
        <button id="send" type="submit" aria-label="Send message"><span>↑</span></button>
      </form>
      <div class="footer-note">AI output can be inaccurate. Review important results.</div>
    </footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
